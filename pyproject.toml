[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackshot"
version = "0.1.0"
description = "Topside visual-inertial odometry for BlueOS ROVs: OAK-D VIO on the surface computer, VISION_POSITION_DELTA to ArduSub"
requires-python = ">=3.11"
dependencies = [
    "depthai==3.12.0",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
    "pymavlink>=2.4.41",
    "websocket-client>=1.8",
    "numpy>=2.0,<3.0",
    "piexif==1.1.3",
    "Pillow>=10.0",
    "platformdirs>=4.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "websockets>=13", "pyinstaller>=6.10"]

[project.gui-scripts]
trackshot = "trackshot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trackshot = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
